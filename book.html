<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book de Trabajos | Santas Uñas</title>
        <meta name="description" content="Especialistas en esculpidas, capping y esmaltado semipermanente. Dale a tus manos el cuidado y el arte que merecen en Zárate.">
            <meta property="og:type" content="website">
            <meta property="og:title" content="Santas Uñas - Salón y Academia">
            <meta property="og:description" content="Especialistas en esculpidas, capping y esmaltado. ¡Reservá tu turno o sumate a nuestros cursos!">
            <meta property="og:image" content="https://nekromancerr.github.io/santas-unias/img/portada-whatsapp.jpg">
            <meta property="og:url" content="https://nekromancerr.github.io/santas-unias/book.html">

            <link rel="icon" type="image/png" href="img/logo-s.webp">
            <link rel="apple-touch-icon" href="img/logo-s.webp">
            <meta name="theme-color" content="#2c2b29">
            <!-- Este manifiesto lo combierte en "app" -->
            <link rel="manifest" href="manifest.json">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
    </head>
<body>
    
    <main class="main">

        <!--================
            Galeria de Fotos  
            ================-->
        <section id="book-gen" class="gallery section container">
            <h1 class="gallery__title">Nuestro <span class="hero__highlight">Book de Trabajos</span></h1>
            <p class="gallery__subtitle">Elegí a tu profesional o inspirate con nuestra galería completa.</p>
        
            <!-- PODIO DE AVATARES (Filtros) -->
            <div class="personal-books__tabs reveal" id="gallery-filters">
                <!-- Botón para ver todo -->
                <button class="tab-btn active" data-filter="all">
                    <div class="tab-img-placeholder" style="background-color: var(--color-primario);">
                        <i class="fa-solid fa-border-all" style="font-size: 2.5rem; color: var(--color-fondo-principal);"></i>
                    </div>
                    <span>Todos</span>
                </button>
        
                <!-- Isis -->
                <button class="tab-btn" data-filter="isis">
                    <div class="tab-img-placeholder">
                        <img src="img/perfil-isis.webp" alt="Isis" loading="lazy"> 
                    </div>
                    <span>Isis</span>
                </button>
                    
                <!-- Jose -->
                <button class="tab-btn" data-filter="jose">
                    <div class="tab-img-placeholder">
                        <img src="img/perfil-jose.webp" alt="Jose" loading="lazy"> 
                    </div>
                    <span>Jose</span>
                </button>
                    
                <!-- Lola -->
                <button class="tab-btn" data-filter="lola">
                    <div class="tab-img-placeholder">
                        <img src="img/perfil-lola.webp" alt="Lola" loading="lazy"> 
                    </div>
                    <span>Lola</span>
                </button>
        
                <!-- Agus -->
                <button class="tab-btn" data-filter="agus">
                    <div class="tab-img-placeholder">
                        <img src="img/perfil-agus.webp" alt="Agus" loading="lazy"> 
                    </div>
                    <span>Agus</span>
                </button>
            </div>
        
            <!-- GRILLA MASONRY -->
            <div class="gallery-frame" id="gallery-frame">
                <div class="gallery__grid" id="main-gallery-grid">
                    <!-- Las fotos se inyectan acá desde JavaScript -->
                </div>
            </div>
        
            <div style="text-align: center; margin-top: 40px;">
                <button id="btn-show-all" class="button--subtle">Ver galería completa</button>
            </div>
        </section>
    </main>
    
    <a href="https://api.whatsapp.com/send/?phone=3487728179" class="whatsapp-float" target="_blank" aria-label="Chatear por WhatsApp">
        <i aria-hidden="true" class="fa-brands fa-whatsapp"></i>
    </a>
    <button class="scroll-top" id="scroll-top" aria-label="Volver arriba">
        <i aria-hidden="true" class="fa-solid fa-arrow-up"></i>
    </button>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/gallery.js"></script>
    <script type="module" src="js/lightbox.js"></script>
</body>
</html>
